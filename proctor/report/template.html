<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Отчет по сессии</title>
<style>
body{font-family:'Segoe UI',Arial,sans-serif;font-size:14px;background:#F5F5F5;color:#1A1A1A;margin:0;padding:16px}
.panel{background:#FFFFFF;border:1px solid #CCCCCC;border-radius:2px;padding:16px;margin-bottom:16px}
h1{font-size:18px;margin:0 0 8px 0}
table{width:100%;border-collapse:collapse;background:#FFFFFF}
th,td{border:1px solid #CCCCCC;padding:8px;text-align:left;font-size:14px}th{font-weight:bold}
tr.total td{font-weight:bold}
img.thumb{width:160px;height:120px;object-fit:cover;border:1px solid #CCCCCC;display:block}
</style>
</head>
<body>
<div class="panel"><h1>Отчет: ФИО студента</h1><p>Нарушений: 0. Индекс доверия: 100/100.</p><p>Целостность лога: OK</p></div>
<div class="panel">
<table>
<tr><th>Время</th><th>Тип</th><th>Длительность</th><th>Скриншот</th></tr>
<tr><td colspan="4">Нарушений не зафиксировано</td></tr>
<tr class="total"><td colspan="2">Итого</td><td>0 с</td><td>0 событий</td></tr>
</table>
</div>
</body>
</html>
