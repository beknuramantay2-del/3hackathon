profile: dev

test:
  test_url: ""
  allowed_domains: []

camera:
  index: 0
  width: 640
  height: 480
  fps: 30
  mirror_preview: true

yolo:
  model: proctor/weights/yolov8n.pt
  imgsz: 640
  conf_phone: 0.25
  conf_person: 0.5
  target_fps: 8
  detail_search: true
  desk_search: true
  device: auto
  offline: true
  phone_class: 67
  person_class: 0
  vote_window: 8
  vote_threshold: 4

face:
  max_faces: 2
  target_fps: 15
  max_width: 640
  hands_enabled: true
  hands_fps: 5
  refine_landmarks: true
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

calibration:
  duration_sec: 30.0

preflight:
  virtual_check_enabled: true
  virtual_keywords:
    - virtual
    - obs
    - droidcam
    - manycam
    - splitcam
    - screen
    - capture

rules:
  phone_detected:
    enabled: true
    hold: 0.5
    cooldown: 5.0
  phone_raised:
    enabled: true
    hold: 1.0
    cooldown: 5.0
  phone_aimed:
    enabled: true
    hold: 2.0
    cooldown: 8.0
  gaze_down:
    enabled: true
    pitch_thresh: 12.0
    hold: 3.0
    cooldown: 5.0
  gaze_side:
    enabled: true
    yaw_thresh: 18.0
    iris_thresh: 0.10
    hold: 2.0
    cooldown: 5.0
  no_face:
    enabled: true
    hold: 2.0
    cooldown: 5.0
  multi_face:
    enabled: true
    hold: 1.0
    cooldown: 5.0
  camera_covered:
    enabled: true
    brightness_thresh: 25.0
    variance_thresh: 120.0
    hold: 1.5
    cooldown: 5.0
  gap_tolerance: 0.3

trust_weights:
  PHONE_DETECTED: 15
  PHONE_RAISED: 20
  PHONE_AIMED: 25
  GAZE_DOWN: 5
  GAZE_LEFT: 3
  GAZE_RIGHT: 3
  GAZE_UP: 3
  HEAD_LEFT: 3
  HEAD_RIGHT: 3
  HEAD_UP: 3
  HEAD_DOWN: 5
  NO_FACE: 30
  MULTI_FACE: 20
  HOTKEY_BLOCKED: 8
  FOCUS_LOST: 10
  SECOND_MONITOR: 15
  TAB_SWITCH: 5
  NAV_BLOCKED: 5

guard:
  focus_check_ms: 300
  process_check_sec: 2.0
  clipboard_clear_sec: 5.0
  process_mode: log
  forbidden_processes:
    - chrome
    - msedge
    - firefox
    - opera
    - brave
    - vivaldi
    - telegram
    - discord
    - anydesk
    - teamviewer
    - rustdesk
  hotkeys:
    - alt+tab
    - left windows
    - right windows
    - print screen
    - ctrl+c
    - ctrl+v
    - ctrl+x
    - alt+f4
    - ctrl+n
    - ctrl+t
    - ctrl+w
    - ctrl+tab
    - f12
    - ctrl+u
    - ctrl+shift+i
  exit_combo: ctrl+shift+f12
  examiner:
    salt_hex: ""
    hash_hex: ""
    iterations: 100000

performance:
  mode: auto
  adaptive: true
  threads: 2

store:
  db: data/session.db
  screenshots: data/shots
  save_screenshots: true

examiner:
  host: 127.0.0.1
  port: 8901

hash_chain:
  enabled: true
  salt_hex: ""

report:
  out: data/report.html

policy:
  yellow_sec: 3.0
  red_sec: 5.0
  immediate_phone_conf: 0.55

evidence:
  fps: 5
  pre_sec: 2.0
  post_sec: 2.0
  segment_sec: 15.0
